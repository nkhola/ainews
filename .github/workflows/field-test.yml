name: Field Test

# Dispatch-only. Never runs on a schedule and never touches the briefing pipeline.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Experiment directory under experiments/'
        required: true
        default: 'ft-m1-say-it-once'
      n_trials:
        description: 'Trials per (task, condition) cell'
        required: true
        default: '10'
      constraints:
        description: 'Legacy arm selector (older rigs only); ignore for harness experiments'
        required: false
        default: 'single_quotes'
      model_override:
        description: 'Optional model id, e.g. gemini-3.1-pro-preview'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests google-auth

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Run experiment
        env:
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          N_TRIALS: ${{ github.event.inputs.n_trials }}
          LLM_MODEL_OVERRIDE: ${{ github.event.inputs.model_override }}
          RUN_ARMS: ${{ github.event.inputs.constraints == 'single_quotes' && '' || github.event.inputs.constraints }}
          OUT_SUFFIX: ${{ github.event.inputs.constraints == 'single_quotes' && '' || '_alone' }}
        run: |
          EXP="${{ github.event.inputs.experiment }}"
          # Probe mode, and harness experiments (exp.py), take precedence over legacy run.py
          if [ "$EXP" = "probe" ]; then
            python experiments/_harness/probe_models.py
            exit 0
          fi
          if [ -f "experiments/$EXP/exp.py" ]; then
            python experiments/_harness/core.py "$EXP"
            python experiments/_harness/metrics.py "$EXP" | tee "experiments/$EXP/results/summary.txt"
            exit 0
          fi
          CS="${{ github.event.inputs.constraints }}"
          if [ "$CS" = "all" ]; then CS="no_comments single_quotes no_docstring no_type_hints"; fi
          for c in $CS; do
            echo "::group::constraint $c"
            CONSTRAINT_ID=$c python experiments/${{ github.event.inputs.experiment }}/run.py
            echo "::endgroup::"
          done

      - name: Analyze (legacy rigs only)
        if: ${{ github.event.inputs.experiment != 'probe' }}
        run: |
          EXP="${{ github.event.inputs.experiment }}"
          if [ ! -f "experiments/$EXP/exp.py" ] && [ -f "experiments/$EXP/analyze.py" ]; then
            python experiments/$EXP/analyze.py | tee experiments/$EXP/results/summary.txt
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.experiment != 'probe' }}
        with:
          name: ${{ github.event.inputs.experiment }}-results
          path: experiments/${{ github.event.inputs.experiment }}/results/

      - name: Commit results
        if: ${{ github.event.inputs.experiment != 'probe' }}
        run: |
          # Several experiments run concurrently, so pushes race. Retry with rebase.
          git config user.name "field-test-bot"
          git config user.email "actions@github.com"
          git add experiments/*/results/ || true
          if git diff --staged --quiet; then echo "no results to commit"; exit 0; fi
          git commit -q -m "field-test: ${{ github.event.inputs.experiment }} results (n=${{ github.event.inputs.n_trials }})"
          for i in 1 2 3 4 5 6; do
            if git push -q origin HEAD:main 2>/dev/null; then echo "pushed on attempt $i"; exit 0; fi
            sleep $(( (RANDOM % 12) + 4 ))
            git pull --rebase -q origin main || git rebase --abort || true
          done
          echo "push failed after retries; results are still in the uploaded artifact"
          exit 0
